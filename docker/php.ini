; PHP-Einstellungen für den Produktivbetrieb im Container
expose_php = Off
memory_limit = 256M
max_execution_time = 120
date.timezone = UTC

; OPcache: Code im Image ändert sich nie, daher keine Zeitstempelprüfung
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
